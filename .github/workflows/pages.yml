name: Publish the papers

# On every push to main that changes a paper, compile every papers/<name>/main.tex, then every supplement
# papers/<name>/supplement.tex (which reads its paper's main.aux), and publish the PDFs, with an index page, to GitHub
# Pages (https://dickie81.github.io/number-theory/). Pull requests are checked by ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the papers
        uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/*/main.tex
          work_in_root_file_dir: true

      - name: Compile the supplements
        uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/*/supplement.tex
          work_in_root_file_dir: true

      - name: Build the site
        run: python3 scripts/build_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
