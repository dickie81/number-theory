name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # for dorny/paths-filter on pull requests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the Lean build runs. On a pull request it runs only if the pull request changes a file the build reads;
  # on pushes to main and on manual runs it always runs. paths-filter lists a pull request's files through the
  # GitHub API, so this job needs no checkout.
  changes:
    name: Lean changes
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lean == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lean:
              - 'lib/**'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'scripts/build.sh'
              - 'scripts/lean-slots.sh'
              - 'scripts/check_axioms.py'
              - '.github/actions/lean-build/**'
              - '.github/workflows/ci.yml'

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No escape hatches in the library's sources
        run: python3 scripts/check_hygiene.py
      - name: lakefile.lean matches lib/
        run: python3 scripts/gen_lakefile.py --check
      - name: The vendored libraries are upstream's with the port patches
        run: python3 scripts/check_vendor.py
      - name: The certificate regenerates
        run: python3 tools/linnik/check_certificate.py

  paper:
    name: The Linnik paper builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          working_directory: papers/linnik-exponent
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: linnik-exponent
          path: papers/linnik-exponent/main.pdf
          retention-days: 14

  # The Lean build in stages: a cold build takes longer than one job may run (six hours). Each stage continues from
  # the previous stage's cache, and runs only if the previous one stopped at its time limit.
  build-1:
    name: Lean build (stage 1)
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '1'

  build-2:
    name: Lean build (stage 2)
    needs: build-1
    if: needs.build-1.outputs.partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '2'

  build-3:
    name: Lean build (stage 3)
    needs: build-2
    if: needs.build-2.outputs.partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '3'
          last: 'true'
