name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # for dorny/paths-filter on pull requests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change touches. On a pull request paths-filter lists the pull request's files through the GitHub API; on
  # a push to main it compares the push with the commit before it. The checkout holds only papers/ and tools/linnik/.
  # - lean: whether the Lean build runs. On a pull request it runs only if the pull request changes a file the build
  #   reads; on pushes to main and on manual runs it always runs.
  # - papers: the papers to compile, by name, separated by spaces: each papers/<name>/ in which the change edits a
  #   file other than Markdown (a README needs no compile), so that a change to no paper compiles none. A change to
  #   this workflow, the site's builder, or the page on the zeros or its script compiles every paper, since the site
  #   needs every paper's PDF; so does a manual run.
  # - certificate: whether the certificates are regenerated (the job `certificate`): only if the change edits a file
  #   that the check reads, as `tools/linnik/check_certificate.py --inputs` lists them, or this workflow; and on a
  #   manual run.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ github.event_name != 'pull_request' || steps.lean.outputs.lean == 'true' }}
      papers: ${{ steps.papers.outputs.list }}
      certificate: ${{ github.event_name == 'workflow_dispatch' || steps.certificate.outputs.certificate == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers
            tools/linnik
      - id: lean
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lean:
              - 'lib/**'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'scripts/build.sh'
              - 'scripts/lean-slots.sh'
              - 'scripts/check_axioms.py'
              - 'scripts/check_warnings.py'
              - 'scripts/lean_targets.py'
              - 'scripts/import_cone.py'
              - '.github/actions/lean-build/**'
              - '.github/workflows/ci.yml'
      - id: tex
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            every:
              - '.github/workflows/ci.yml'
              - 'scripts/build_site.py'
              - 'scripts/zeros_page.py'
              - 'site/**'
            papers:
              - 'papers/*/**'
      - id: papers
        name: The papers to compile
        env:
          EVERY: ${{ github.event_name == 'workflow_dispatch' || steps.tex.outputs.every == 'true' }}
          FILES: ${{ steps.tex.outputs.papers_files }}
        run: |
          if [ "$EVERY" = true ]; then
            names=$(for f in papers/*/main.tex; do basename "$(dirname "$f")"; done)
          else
            names=$(for f in $FILES; do case "$f" in *.md) ;; *) echo "$f" | cut -d/ -f2 ;; esac; done | sort -u)
          fi
          list=""
          for n in $names; do
            if [ -f "papers/$n/main.tex" ]; then list="$list $n"; fi
          done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "The papers to compile:${list:- none}"
      # If the script fails, or lists no inputs, the job fails: a broken check must not be skipped.
      - id: inputs
        name: The files that the certificates' check reads
        if: github.event_name != 'workflow_dispatch'
        run: |
          inputs=$(python3 tools/linnik/check_certificate.py --inputs)
          echo "$inputs" | grep -qx 'tools/linnik/check_certificate.py'
          {
            echo 'filter<<EOF'
            echo 'certificate:'
            echo "  - '.github/workflows/ci.yml'"
            echo "$inputs" | sed "s/.*/  - '&'/"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - id: certificate
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: ${{ steps.inputs.outputs.filter }}

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No escape hatches in the library's sources
        run: python3 scripts/check_hygiene.py
      - name: lakefile.lean matches lib/
        run: python3 scripts/gen_lakefile.py --check
      - name: docs/inventory.md matches the sources
        run: python3 scripts/inventory.py --check
      - name: docs/account.md names only what the library declares
        run: python3 scripts/check_account.py
      - name: The page on the zeros agrees with the Lean and the paper
        run: python3 scripts/zeros_page.py --check
      - name: The vendored libraries are upstream's with the port patches
        run: python3 scripts/check_vendor.py

  # The certificates' Lean files in lib/pnt are the ones tools/linnik generates (about ten minutes), checked only when
  # the change touches a file that the check reads (the job `changes`).
  certificate:
    name: The certificate regenerates
    needs: changes
    if: needs.changes.outputs.certificate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The certificates' files are the ones the scripts generate
        run: python3 tools/linnik/check_certificate.py

  # The papers that the change touches (the job `changes`): each papers/<name>/main.tex, then its supplement
  # papers/<name>/supplement.tex, which reads its paper's cross-references from main.aux. A new paper needs no change
  # here. The PDFs are kept under the site's names, <name>.pdf and <name>-supplement.pdf, as the artifact `papers`,
  # which the job pdf-preview shows on a pull request. If every paper was compiled, then the site, as pages.yml builds
  # it, with the page on the zeros, which cites the compiled paper's numbering.
  papers:
    name: The papers build
    needs: changes
    if: needs.changes.outputs.papers != ''
    runs-on: ubuntu-latest
    outputs:
      pdfs: ${{ steps.pdfs.outputs.artifact-url }}
    env:
      PAPERS: ${{ needs.changes.outputs.papers }}
    steps:
      - uses: actions/checkout@v4
      - id: roots
        name: The sources to compile
        run: |
          every=true
          for f in papers/*/main.tex; do
            case " $PAPERS " in *" $(basename "$(dirname "$f")") "*) ;; *) every=false ;; esac
          done
          {
            echo 'main<<EOF'
            for n in $PAPERS; do echo "papers/$n/main.tex"; done
            echo 'EOF'
            echo 'supplement<<EOF'
            for n in $PAPERS; do
              if [ -f "papers/$n/supplement.tex" ]; then echo "papers/$n/supplement.tex"; fi
            done
            echo 'EOF'
            echo "every=$every"
          } >> "$GITHUB_OUTPUT"
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.roots.outputs.main }}
          work_in_root_file_dir: true
      - uses: xu-cheng/latex-action@v4
        if: steps.roots.outputs.supplement != ''
        with:
          root_file: ${{ steps.roots.outputs.supplement }}
          work_in_root_file_dir: true
      - name: The PDFs under the site's names
        run: |
          mkdir pdf
          for n in $PAPERS; do
            cp "papers/$n/main.pdf" "pdf/$n.pdf"
            if [ -f "papers/$n/supplement.tex" ]; then cp "papers/$n/supplement.pdf" "pdf/$n-supplement.pdf"; fi
          done
      - id: pdfs
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: pdf/*.pdf
          if-no-files-found: error
          retention-days: 14
      - name: The site builds
        if: steps.roots.outputs.every == 'true'
        run: python3 scripts/build_site.py _site
      - uses: actions/upload-artifact@v4
        if: steps.roots.outputs.every == 'true'
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 14

  # On a pull request from this repository, the PDFs on a branch of their own, pdf-preview/pr-<number>: one commit that
  # holds only them, replaced on every push, so that GitHub's file view shows them in the browser. One comment on the
  # pull request links them and the zip of the artifact, updated on every push, and pdf-preview-cleanup.yml deletes the
  # branch when the pull request closes. The job runs none of the pull request's code: it takes the PDFs from the
  # artifact.
  pdf-preview:
    name: The PDFs' preview
    needs: papers
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the preview branch
      pull-requests: write  # the comment that links the PDFs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: papers
          path: pdf
      - id: push
        name: The PDFs on the preview branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd pdf
          git init -q
          git add -- *.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "The papers' PDFs of #$PR, built from ${HEAD_SHA::7}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q -f "$remote" "HEAD:refs/heads/pdf-preview/pr-$PR"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Link the PDFs on the pull request
        uses: actions/github-script@v7
        env:
          ZIP: ${{ needs.papers.outputs.pdfs }}
          PREVIEW: ${{ steps.push.outputs.sha }}
        with:
          script: |
            const marker = '<!-- papers-pdf -->';
            const { owner, repo } = context.repo;
            const files = require('fs').readdirSync('pdf').filter(f => f.endsWith('.pdf')).map(f => f.slice(0, -4))
              .sort().map(f => f + '.pdf');
            const blob = `https://github.com/${owner}/${repo}/blob/${process.env.PREVIEW}`;
            const view = files.map(f => `[\`${f}\`](${blob}/${f})`);
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              `**The papers' PDFs**, built from ${sha.slice(0, 7)}, to read in the browser: ${view.join(', ')}. ` +
                `Or [download them](${process.env.ZIP}) as a zip, kept for 14 days. The preview's branch is deleted ` +
                'when the pull request closes.',
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The Lean build in stages: a cold build takes longer than one job may run (six hours). Each stage continues from
  # the previous stage's cache, and runs only if the previous one stopped at its time limit. Each builds Check,
  # CheckAll, CheckZeta23, CheckDH, and every module the change edits or that imports one (scripts/lean_targets.py);
  # the checkout keeps the commit's parent, a pull request's base.
  build-1:
    name: Lean build (stage 1)
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '1'

  build-2:
    name: Lean build (stage 2)
    needs: build-1
    if: needs.build-1.outputs.partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '2'

  build-3:
    name: Lean build (stage 3)
    needs: build-2
    if: needs.build-2.outputs.partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: build
        uses: ./.github/actions/lean-build
        with:
          stage: '3'
          last: 'true'

  # The one required check of main's branch protection. It passes when every job above passed or was skipped, and
  # fails if any failed or was cancelled. Add new jobs to its needs.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, checks, certificate, papers, pdf-preview, build-1, build-2, build-3]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A job ended with: $r"; exit 1 ;;
            esac
          done
