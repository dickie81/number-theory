name: Lean build stage
description: >-
  One stage of the Lean build. It restores the library's build from the Actions cache, gets Mathlib's prebuilt
  files, builds the targets that validate the change (scripts/lean_targets.py) with scripts/build.sh for at most
  `minutes` minutes, and saves the build to the cache, even when the stage fails or is cancelled. If the build
  finished, it then checks the axioms of Check, CheckAll, CheckZeta23 and CheckDH, and that the library has no dead
  code (scripts/dead_code.py). A cold build takes longer than one job may run, so the workflow chains stages: each
  one continues from the last one's cache. The job must check out the commit with its parent (fetch-depth 2), so
  that a pull request's merge commit has its base.
inputs:
  stage:
    description: The stage's number, used in the cache key.
    required: true
  minutes:
    description: The build's time limit, in minutes.
    default: '315'
  last:
    description: '"true" for the last stage, which fails if the build is still unfinished at its time limit.'
    default: 'false'
outputs:
  partial:
    description: '"true" if the build stopped at its time limit.'
    value: ${{ steps.build.outputs.partial }}
runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Get Mathlib's prebuilt files
      shell: bash
      run: |
        lake exe cache get
        if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]; then
          echo "::error::Mathlib's cache has no prebuilt files for the pinned commit"
          exit 1
        fi

    - name: Restore the library's build
      uses: actions/cache/restore@v4
      with:
        path: .lake/build
        key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
        restore-keys: |
          lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
          lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

    - name: Choose the targets
      id: targets
      shell: bash
      run: |
        # A pull request is compared with its base (the first parent of its merge commit), a push with the commit it
        # replaced. A manual run, a new branch, or a base that cannot be fetched builds every library.
        base=
        case "${{ github.event_name }}" in
          pull_request) base=$(git rev-parse HEAD^1) ;;
          push) base="${{ github.event.before }}" ;;
        esac
        if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
            && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"; }; then
          targets=$(python3 scripts/lean_targets.py "$base")
        else
          targets=$(python3 scripts/lean_targets.py --all)
        fi
        echo "$(echo "$targets" | wc -l) targets:"
        echo "$targets"
        echo "list=$(echo $targets)" >> "$GITHUB_OUTPUT"

    - name: Build
      id: build
      shell: bash
      run: |
        set +e
        timeout "${{ inputs.minutes }}m" scripts/build.sh ${{ steps.targets.outputs.list }}
        rc=$?
        if [ "$rc" -eq 124 ]; then
          pkill -x lean
          sleep 5
          echo "partial=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.last }}" = true ]; then
            echo "::error::The build is unfinished after its last stage"
            exit 1
          fi
          echo "::warning::The build stopped at its time limit; the next stage continues it from the cache"
          exit 0
        fi
        exit "$rc"

    - name: Save the library's build
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .lake/build
        key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}

    - name: Check the axioms
      if: steps.build.outputs.partial != 'true'
      shell: bash
      run: |
        python3 scripts/check_axioms.py
        python3 scripts/check_axioms.py --all
        python3 scripts/check_axioms.py --zeta23
        python3 scripts/check_axioms.py --dh

    - name: No dead code
      if: steps.build.outputs.partial != 'true'
      shell: bash
      run: |
        lake build deadcode
        python3 scripts/dead_code.py
