name: Lean build stage
description: >-
  One stage of the Lean build. It restores the library's build from the Actions cache, gets Mathlib's prebuilt
  files, builds the targets that validate the change (scripts/lean_targets.py), or the targets it is given, with
  scripts/build.sh for at most `minutes` minutes, and saves the build to the cache, even when the stage fails or is
  cancelled. If the build finished, it then checks the axioms of the check files it is given (Check, CheckAll,
  CheckZeta23 and CheckDH by default), that the library has no dead code (scripts/dead_code.py), and that the build's
  log shows no warning in the library's own sources (scripts/check_warnings.py; Lake replays the messages of the
  modules it does not rebuild). A cold build takes longer than one job may run, so the workflow chains stages: each
  one continues from the last one's cache. The job must check out the commit with its parent (fetch-depth 2), so
  that a pull request's merge commit has its base.
inputs:
  stage:
    description: The stage's number, used in the cache key.
    required: true
  minutes:
    description: The build's time limit, in minutes.
    default: '315'
  last:
    description: '"true" for the last stage, which fails if the build is still unfinished at its time limit.'
    default: 'false'
  targets:
    description: >-
      The Lake targets to build, separated by spaces. Empty, the default, for those of scripts/lean_targets.py, which
      leaves out the opt-in Linnik certificates.
    default: ''
  cache:
    description: >-
      The prefix of the build cache's keys. A stage restores the newest build saved under it, or else, for a prefix
      other than the default, the newest build of CI's own builds (`lake-build`), and saves under it.
    default: lake-build
  checks:
    description: The check files of lib/check whose axioms are checked (scripts/check_axioms.py), separated by spaces.
    default: Check CheckAll CheckZeta23 CheckDH
  dead-code:
    description: The options of scripts/dead_code.py; `--full` for the opt-in Linnik certificates too.
    default: ''
outputs:
  partial:
    description: '"true" if the build stopped at its time limit.'
    value: ${{ steps.build.outputs.partial }}
runs:
  using: composite
  steps:
    - name: Install elan
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Get Mathlib's prebuilt files
      shell: bash
      run: |
        lake exe cache get
        if [ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]; then
          echo "::error::Mathlib's cache has no prebuilt files for the pinned commit"
          exit 1
        fi

    - name: Restore the library's build
      uses: actions/cache/restore@v4
      with:
        path: .lake/build
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-
          ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
          lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

    - name: Choose the targets
      id: targets
      shell: bash
      env:
        GIVEN: ${{ inputs.targets }}
      run: |
        # Targets given as an input are built as they are. Otherwise a pull request is compared with its base (the
        # first parent of its merge commit), a push with the commit it replaced. A manual run, a new branch, or a base
        # that cannot be fetched builds every library but the opt-in ones.
        base=
        case "${{ github.event_name }}" in
          pull_request) base=$(git rev-parse HEAD^1) ;;
          push) base="${{ github.event.before }}" ;;
        esac
        if [ -n "$GIVEN" ]; then
          targets=$(printf '%s\n' $GIVEN)
        elif [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
            && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"; }; then
          targets=$(python3 scripts/lean_targets.py "$base")
        else
          targets=$(python3 scripts/lean_targets.py --all)
        fi
        echo "$(echo "$targets" | wc -l) targets:"
        echo "$targets"
        echo "list=$(echo $targets)" >> "$GITHUB_OUTPUT"

    - name: Build
      id: build
      shell: bash
      run: |
        set +e
        timeout "${{ inputs.minutes }}m" scripts/build.sh ${{ steps.targets.outputs.list }} 2>&1 \
          | tee "$RUNNER_TEMP/lean-build.log"
        rc=${PIPESTATUS[0]}
        if [ "$rc" -eq 124 ]; then
          pkill -x lean
          sleep 5
          echo "partial=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.last }}" = true ]; then
            echo "::error::The build is unfinished after its last stage"
            exit 1
          fi
          echo "::warning::The build stopped at its time limit; the next stage continues it from the cache"
          exit 0
        fi
        exit "$rc"

    - name: Save the library's build
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .lake/build
        key: ${{ inputs.cache }}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}

    - name: Check the axioms
      if: steps.build.outputs.partial != 'true'
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
      run: |
        for c in $CHECKS; do
          python3 scripts/check_axioms.py "$c"
        done

    - name: No dead code
      if: steps.build.outputs.partial != 'true'
      shell: bash
      env:
        OPTIONS: ${{ inputs.dead-code }}
      run: |
        lake build deadcode
        python3 scripts/dead_code.py $OPTIONS

    - name: No warnings in the library's sources
      if: steps.build.outputs.partial != 'true'
      shell: bash
      run: python3 scripts/check_warnings.py "$RUNNER_TEMP/lean-build.log"
